<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
</head>
<body>
    <header>
        Projects
    </header>

    <aside>
        <button id="sidebar-toggle-button" ></button>
        <nav>
            <ul>
                <li><a href="#my-projects">My Projects</a></li>
                <li><a href="#calendar">Calendar</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <button id="new-list-button">New list</button>
        <label for="project-search">Search projects</label>
        <input type="search" id="project-search-input">
        <label for="project-sort">Sort by:</label>
        <select id="project-sort-select">
            <option value="Recent">Recent</option>
            <option value="Alphabetical">Alphabetical</option>
            <option value="Completion">Completion</option>
        </select>

        <div id="projects-list">

        </div>
    </main>
</body>
</html>
